<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2838"/>
      <stop offset="1" stop-color="#090C13"/>
    </linearGradient>
    <!-- cylinder shading runs across the tube's thickness -->
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6FFE4"/>
      <stop offset="0.28" stop-color="#4FE3C1"/>
      <stop offset="0.7" stop-color="#2A9BEA"/>
      <stop offset="1" stop-color="#2546C9"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9FFF0"/>
      <stop offset="1" stop-color="#3A7BF0"/>
    </linearGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#6FF0D0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6FF0D0" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4"/>

  <g transform="rotate(-38 512 512)">
    <!-- motion trails from the back end -->
    <rect x="96" y="470" width="150" height="16" rx="8" fill="url(#trail)" opacity="0.5"/>
    <rect x="136" y="504" width="110" height="16" rx="8" fill="url(#trail)" opacity="0.85"/>
    <rect x="116" y="538" width="130" height="16" rx="8" fill="url(#trail)" opacity="0.4"/>

    <g filter="url(#soft)">
      <!-- back end cap, body, front open end -->
      <ellipse cx="282" cy="512" rx="30" ry="64" fill="url(#tube)"/>
      <rect x="282" y="448" width="520" height="128" fill="url(#tube)"/>
      <!-- grip bands -->
      <rect x="430" y="448" width="14" height="128" fill="#071018" opacity="0.3"/>
      <rect x="462" y="448" width="14" height="128" fill="#071018" opacity="0.3"/>
      <ellipse cx="802" cy="512" rx="30" ry="64" fill="url(#rim)"/>
      <ellipse cx="804" cy="512" rx="18" ry="46" fill="#0D1522"/>
    </g>
    <!-- specular line along the top -->
    <rect x="300" y="466" width="470" height="10" rx="5" fill="#FFFFFF" opacity="0.35"/>
  </g>
</svg>
