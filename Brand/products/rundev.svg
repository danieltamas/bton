<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- run.dev's ".D" glyph (its favicon, crisp pixels) on the family's dark tile. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2630"/>
      <stop offset="1" stop-color="#070B0F"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#drop)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/></g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4"/>
  <!-- the glyph: favicon units (40 wide) scaled 15x and centred -->
  <g transform="translate(212 212) scale(15)" shape-rendering="crispEdges">
    <rect x="14" y="5" width="16" height="4" fill="#45C8D4"/>
    <rect x="14" y="5" width="4" height="28" fill="#45C8D4"/>
    <rect x="14" y="29" width="16" height="4" fill="#45C8D4"/>
    <rect x="26" y="9" width="4" height="20" fill="#45C8D4"/>
    <rect x="28" y="13" width="5" height="12" fill="#45C8D4"/>
    <rect x="6" y="26" width="5" height="7" fill="#F4F7F9"/>
  </g>
</svg>
